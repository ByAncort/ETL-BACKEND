spring:
  application:
    name: integration-ms-test
  datasource:
    url: jdbc:h2:mem:integration_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
# URLs ficticias para que el contexto cargue sin servicios externos
api:
  register:
    ms:
      url: http://localhost:0/api-registry
  matcher-ms:
    url: http://localhost:0
server:
  port: 0
